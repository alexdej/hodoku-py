name: Nightly Coverage

on:
  schedule:
    - cron: "0 7 * * *"  # daily at 07:00 UTC (after parity-nightly)
  workflow_dispatch:

jobs:
  # Skip scheduled runs when main hasn't changed since the last published
  # report (tracked in coverage/source-sha.txt on gh-pages). Manual runs always proceed.
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/coverage/source-sha.txt?ref=gh-pages" 2>/dev/null || true)
          if [ "$EVENT" = "schedule" ] && [ "$last" = "$SHA" ]; then
            echo "Report already published for $SHA; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  accel:
    name: Coverage (C extensions)
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e .[test,test-parity]

      - name: Unit tests
        run: >
          pytest -m unit -v --tb=short
          --cov=src/hodoku

      - name: Reglib regression suite
        run: >
          pytest tests/reglib/ --ignore=tests/reglib/test_reglib_ex.py -v --tb=short
          --cov=src/hodoku --cov-append

      - name: Reglib find-all-steps (test_reglib_ex)
        run: >
          pytest tests/reglib/test_reglib_ex.py -v --tb=short
          --cov=src/hodoku --cov-append

      - name: Exemplars parity coverage
        run: >
          pytest tests/parity/ --puzzle-file exemplars-1.0 -v --tb=short
          --puzzle-timeout 300
          --cov=src/hodoku --cov-append

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-accel
          path: .coverage
          include-hidden-files: true

  fallback:
    name: Coverage (pure-Python fallback)
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      HODOKU_NO_ACCEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install -e .[test]

      - name: Unit tests (generator fallback)
        run: >
          pytest -m unit -v --tb=short
          --cov=src/hodoku

      - name: Generator API tests (generate/validate fallback)
        run: >
          pytest tests/generator/test_generator_api.py -v --tb=short
          --cov=src/hodoku --cov-append

      - name: Reglib suite (fish fallback)
        run: >
          pytest tests/reglib/ --ignore=tests/reglib/test_reglib_ex.py -v --tb=short
          --cov=src/hodoku --cov-append

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-fallback
          path: .coverage
          include-hidden-files: true

  report:
    name: Combine & publish report
    runs-on: ubuntu-latest
    needs: [check, accel, fallback]
    if: always() && needs.check.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install coverage

      - name: Download accel coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-accel
          path: coverage-accel/

      - name: Download fallback coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage-fallback
          path: coverage-fallback/

      - name: Combine and generate HTML report
        run: |
          coverage combine coverage-accel/.coverage coverage-fallback/.coverage
          coverage html -d site/coverage/
          coverage json -o site/coverage/coverage.json
          rm -f site/coverage/.gitignore
          echo "$GITHUB_SHA" > site/coverage/source-sha.txt

      - name: Deploy coverage to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
