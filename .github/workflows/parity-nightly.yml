name: Nightly Parity

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  parity:
    name: ${{ matrix.puzzle-file }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        puzzle-file:
          - exemplars-1.0
          - top1465
          - qqwing_simple
          - qqwing_easy
          - qqwing_intermediate
          - qqwing_expert
          - HardestDatabase110626
        include:
          - puzzle-file: HardestDatabase110626
            puzzle-timeout: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e .[test,test-parity]

      - name: Run parity tests
        run: >
          pytest tests/parity/ --puzzle-file ${{ matrix.puzzle-file }} --puzzle-timeout ${{ matrix.puzzle-timeout || 30 }} -v --tb=short --junitxml=parity-results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parity-${{ matrix.puzzle-file }}
          path: parity-results.xml

  report:
    name: Generate report
    runs-on: ubuntu-latest
    needs: parity
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install anybadge

      - name: Download all parity results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: parity-*
          path: parity-results/

      - name: Generate report
        run: python scripts/generate_parity_report.py --results-dir parity-results/ --output-dir site/parity/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/
          keep_files: true
