name: Test deploy (manual)

on:
  workflow_dispatch:
    inputs:
      keep_files:
        description: "Keep existing files on gh-pages (false = clean deploy, removes legacy root-level files)"
        type: boolean
        default: false

jobs:
  deploy-test:
    name: Rebuild & deploy from previous artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install coverage anybadge

      # --- Coverage: download artifacts from last successful coverage run ---
      - name: Download coverage artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nightly runs skipped for an unchanged main succeed without artifacts,
          # so pick the latest successful run that still has the ones we need.
          RUN_ID=""
          for id in $(gh run list --workflow=coverage-nightly.yml --status=success --limit=30 --json databaseId -q '.[].databaseId'); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
              -q '[.artifacts[] | select(.expired | not) | .name | select(. == "coverage-accel" or . == "coverage-fallback")] | length')
            if [ "$n" -eq 2 ]; then RUN_ID=$id; break; fi
          done
          [ -n "$RUN_ID" ] || { echo "No successful coverage run with artifacts found"; exit 1; }
          echo "Downloading artifacts from coverage run $RUN_ID"
          gh run download "$RUN_ID" --name coverage-accel --dir coverage-accel/
          gh run download "$RUN_ID" --name coverage-fallback --dir coverage-fallback/

      - name: Generate coverage HTML
        run: |
          coverage combine coverage-accel/.coverage coverage-fallback/.coverage
          coverage html -d site/coverage/
          coverage json -o site/coverage/coverage.json
          rm -f site/coverage/.gitignore
          echo "Coverage files:"
          find site/coverage/ -type f | head -20
          echo "... $(find site/coverage/ -type f | wc -l) files total"

      # --- Parity: download artifacts from last successful parity run ---
      - name: Download parity artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=""
          for id in $(gh run list --workflow=parity-nightly.yml --status=success --limit=30 --json databaseId -q '.[].databaseId'); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
              -q '[.artifacts[] | select(.expired | not) | select(.name | startswith("parity-"))] | length')
            if [ "$n" -gt 0 ]; then RUN_ID=$id; break; fi
          done
          [ -n "$RUN_ID" ] || { echo "No successful parity run with artifacts found"; exit 1; }
          echo "Downloading artifacts from parity run $RUN_ID"
          gh run download "$RUN_ID" --pattern 'parity-*' --dir parity-results/

      - name: Generate parity report
        run: |
          python scripts/generate_parity_report.py --results-dir parity-results/ --output-dir site/parity/
          echo "Parity files:"
          find site/parity/ -type f | head -20

      # --- Deploy both ---
      - name: Show site layout
        run: find site/ -type f | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/
          keep_files: ${{ inputs.keep_files }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
